# Worker 基本信息
name = "warden-worker"
main = "build/index.js"
compatibility_date = "2025-09-19"

# D1 数据库绑定（必须完整，否则会被认为是新建/覆盖）
[[d1_databases]]
binding = "vault1"
database_id = "0003240d-3409-4346-bf2e-7dc731a8d724"

# 速率限制（保护登录端点防止暴力攻击）
# 每个邮箱每 60 秒最多 5 次登录尝试
[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# R2 存储桶（可选，用于文件附件，需要绑定信用卡）
# R2 优先级最高：如果配置了 R2，将忽略 KV
# 取消注释以启用 R2 附件存储：
# [[r2_buckets]]
# binding = "ATTACHMENTS_BUCKET"
# bucket_name = "warden-attachments"

# KV 命名空间（可选，用于文件附件，不需要信用卡）
# KV 每个值最大 25MB；如果未配置 R2，将使用 KV
# 取消注释以启用 KV 附件存储：
# [[kv_namespaces]]
# binding = "ATTACHMENTS_KV"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

# 定时任务：每天 UTC 03:00 清理软删除的密码项
# [triggers]
# crons = ["0 3 * * *"]

# 构建配置
[build]
command = "worker-build --release"

[assets]
directory = "./static/web-vault"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/identity/*", "/sends/*", "/wang/*", "/demo.html"]
